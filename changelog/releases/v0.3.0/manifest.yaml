title: Compose and deliver complete Gmail messages
intro: >-
  Quarto Mail now creates self-contained MIME messages for new mail, replies, reply-all,
  forwards, and Gmail drafts. It also improves sender identities and makes replies
  to externally generated messages more reliable.
