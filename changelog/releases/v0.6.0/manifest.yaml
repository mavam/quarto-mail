created: 2026-09-22
title: Native Gmail delivery
intro: >-
  Delivery scripts now hand the approved message to gog's Gmail commands instead of
  raw API requests, so the message you approve is readable RFC822 in the script itself
  and never lands in a temporary file. Rendering and delivery need only gog's gmail
  commands, and running a script now requires gog 0.41 or later.
