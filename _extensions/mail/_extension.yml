title: Mail
author: Matthias Vallentin
version: 0.1.0
quarto-required: ">=1.4.0"
contributes:
  formats:
    common:
      filters:
        - mail.lua
      wrap: none
    html:
      minimal: true
      template: template.html
    plain:
      validate-yaml: false
      standalone: false
      writer: plain.lua
      output-ext: txt
    gog:
      validate-yaml: false
      standalone: false
      writer: gog.lua
      output-ext: sh
